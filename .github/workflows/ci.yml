name: MVP acceptance
on: [push, pull_request, workflow_dispatch]
jobs:
  acceptance:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: 'true'
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret-at-least-fifty-characters-123456
      APP_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv backend/.venv
      - run: backend/.venv/bin/python -m pip install -r backend/requirements.txt
      - working-directory: backend
        run: |
          .venv/bin/python -m ruff check apps config tests
          .venv/bin/python manage.py check
          .venv/bin/python manage.py makemigrations --check --dry-run
          .venv/bin/python -m pytest -q --junitxml=../test-report-backend.xml
          .venv/bin/python manage.py migrate --noinput
          .venv/bin/python manage.py seed_demo
      - working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run e2e
      - run: backend/.venv/bin/python scripts/production_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-reports
          path: |
            test-report-backend.xml
            frontend/playwright-report
            docs/production-smoke.json
