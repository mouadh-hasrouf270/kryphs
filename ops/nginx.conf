# Bind this service to loopback behind an HTTPS reverse proxy.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 512m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location / { try_files $uri $uri/ /index.html; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location /static/ { alias /static/; }
    location ~ ^/(api|admin)/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        # The outer HTTPS proxy is mandatory and is the public boundary.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
